<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="identity">
            <a class="avatar-link" href="about.html" aria-label="About Your Name">
                <img class="avatar" src="assets/avatar.svg" alt="">
            </a>
            <div class="name-wrap">
                <a class="name" href="about.html" id="name-link">Your Name</a>
                <div class="about-preview" id="about-preview" role="tooltip">
                    <p class="about-preview__role">Designer &amp; developer</p>
                    <p class="about-preview__bio">A short placeholder bio about the work, process, and the kind of projects you take on.</p>
                    <span class="about-preview__cta">View about →</span>
                </div>
            </div>
        </div>

        <div class="header-actions">
            <a class="icon-link" href="mailto:hello@example.com" aria-label="Email">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3.5 6.75A2.25 2.25 0 0 1 5.75 4.5h12.5A2.25 2.25 0 0 1 20.5 6.75v10.5A2.25 2.25 0 0 1 18.25 19.5H5.75A2.25 2.25 0 0 1 3.5 17.25V6.75Zm1.7.55 6.4 4.48a.75.75 0 0 0 .8 0l6.4-4.48a.75.75 0 0 0-.8-1.26L12 10.7 5.2 6.04a.75.75 0 1 0-.8 1.26Z"/>
                </svg>
            </a>
            <a class="icon-link" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.54 8.75H3.86V20.5h2.68V8.75ZM5.2 3.5A1.56 1.56 0 1 0 5.2 6.62 1.56 1.56 0 0 0 5.2 3.5ZM20.5 20.5h-2.67v-5.7c0-1.36-.03-3.1-1.89-3.1-1.9 0-2.19 1.48-2.19 3v5.8H11.1V8.75h2.56v1.6h.04c.36-.68 1.23-1.4 2.53-1.4 2.7 0 3.27 1.78 3.27 4.1V20.5Z"/>
                </svg>
            </a>
        </div>
    </header>

    <main>
        <section class="hero" aria-label="Featured project">
            <div class="hero__vignette" aria-hidden="true"></div>
            <div class="stage">
                <figure class="stage__shot stage__shot--tl float-a">
                    <img data-slot="0" alt="">
                </figure>
                <figure class="stage__shot stage__shot--tr float-b">
                    <img data-slot="1" alt="">
                </figure>
                <figure class="stage__shot stage__shot--bl float-c">
                    <img data-slot="2" alt="">
                </figure>
                <figure class="stage__shot stage__shot--br float-d">
                    <img data-slot="3" alt="">
                </figure>
                <div class="stage__logo">
                    <img id="project-logo" src="assets/logos/project-1.svg" alt="Project 1">
                </div>
            </div>
        </section>

        <section class="project-strip" id="projects" aria-label="Projects">
            <p class="project-strip__label">Selected work</p>
            <div class="project-strip__track" role="tablist" aria-label="Choose a project">
                <button class="project-btn is-active" type="button" role="tab" aria-selected="true" data-project="0">
                    <img src="assets/projects/p1-0.svg" alt="">
                    <span class="project-btn__meta">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="project-btn__title">Project 1</span>
                    </span>
                </button>
                <button class="project-btn" type="button" role="tab" aria-selected="false" data-project="1">
                    <img src="assets/projects/p2-0.svg" alt="">
                    <span class="project-btn__meta">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="project-btn__title">Project 2</span>
                    </span>
                </button>
                <button class="project-btn" type="button" role="tab" aria-selected="false" data-project="2">
                    <img src="assets/projects/p3-0.svg" alt="">
                    <span class="project-btn__meta">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="project-btn__title">Project 3</span>
                    </span>
                </button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer__top">
            <div>
                <p class="footer__name">Your Name</p>
                <p class="footer__note">Available for work · City, Country</p>
            </div>
            <nav class="footer__nav" aria-label="Footer">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="#projects">Projects</a>
            </nav>
            <div class="footer__social">
                <a href="mailto:hello@example.com">hello@example.com</a>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
        <p class="footer__copy">© <span id="year"></span> Your Name. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
